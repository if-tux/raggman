version: "2"

sql:
  - engine: "postgresql"
    schema: "internal/infra/postgres/migrations"
    queries: "internal/infra/postgres/queries"
    gen:
      go:
        package: "sqlc"
        out: "internal/infra/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "vector"
            go_type:
              import: "github.com/pgvector/pgvector-go"
              type: "Vector"